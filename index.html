<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A.M. Testing Suite</title>
    <style>
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
        background: #f5f7ff;
        color: #111827;
      }
      .wrap {
        max-width: 760px;
        margin: 40px auto;
        padding: 0 16px;
      }
      .card {
        background: #fff;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 16px 40px rgba(17, 24, 39, 0.12);
      }
      h1 {
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 16px;
        color: #4b5563;
      }
      .links {
        display: grid;
        gap: 10px;
      }
      a {
        display: inline-block;
        text-decoration: none;
        background: #314dcc;
        color: #fff;
        border-radius: 10px;
        padding: 10px 12px;
        font-weight: 600;
      }
      code {
        background: #eef2ff;
        border-radius: 6px;
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <h1>Testing Suite Installed</h1>
        <p>The full testing software is now integrated directly into this website (no iframe embed).</p>
        <div class="links">
          <a href="/admin-sign-in">Open Admin Sign-In</a>
          <a href="/sign-in">Open Student Sign-In</a>
          <a href="/student-dashboard">Open Student Dashboard</a>
          <a href="/student-stats">Open Student Stats</a>
        </div>
        <p style="margin-top:14px;">Admin panel route: <code>/admin</code></p>
      </section>
    </main>
  </body>
</html>
